dispatch-why-train-invalid=Train __1__ was removed or changed before its orders could be written.
dispatch-fix-train-invalid=Nothing. Another train is chosen on the next cycle.
dispatch-why-depot-invalid=The depot of train __1__ was removed before its orders could be written.
dispatch-fix-depot-invalid=Rebuild the depot, or send the train to another one.
dispatch-why-provider-invalid=The provider was removed before the orders of train __1__ could be written.
dispatch-fix-provider-invalid=Nothing, if you removed it on purpose.
dispatch-why-requester-invalid=The requester was removed before the orders of train __1__ could be written.
dispatch-fix-requester-invalid=Nothing, if you removed it on purpose.
dispatch-why-schedule-rejected=Logged by an older version that did not record the cause. Usually train __1__ was heading to its depot and had no path to the provider, and its schedule was left alone. Rarely the orders were written and stayed on the train.
dispatch-fix-schedule-rejected=Nothing. New rows name the cause.
dispatch-why-no-path=Train __1__ was heading back to its depot (__2__) when it was picked. No track leads from where it was to the provider, so its schedule was left alone. It drives on, can be picked again after 5 s, and the request is retried on the next cycle.
dispatch-fix-no-path=Nothing, if this is rare. If the same train or provider repeats, make the provider reachable from the track trains take back to their depots, or turn off depot bypass on that depot.
dispatch-why-path-blocked=Train __1__ was heading back to its depot (__2__). A route to the provider exists, but the train could not reserve its start at that moment (a red signal or an occupied block ahead), so its schedule was left alone. It drives on and is tried again after 5 s.
dispatch-fix-path-blocked=Nothing, if this is rare. If the same train repeats, check what holds it at its signal; many rows from one junction can mean trains queue inside it.
dispatch-why-no-path-after-write=The delivery was written into the schedule of train __1__, but the game then reported no path (__2__), so it was not counted. The orders stay on the train until it is dispatched again.
dispatch-fix-no-path-after-write=Open the train: if it shows No path, fix the route to the provider.
